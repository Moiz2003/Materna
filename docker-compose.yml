# Antenatal Review Board — one service per process.
# docker compose up brings the whole system live.
# §3.5 SDD, P14 Playbook.
#
# SECURITY: The orchestrator and UI ports are NOT exposed to the host by default.
# All external traffic must go through Clinify's Express proxy (:5000) which
# enforces JWT + doctor-role auth. Uncomment port mappings only for local dev.

version: "3.8"

services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arb-orchestrator
    # SECURITY: Do NOT expose port 8000 to host in production.
    # Uncomment the line below for local dev only:
    # ports:
    #   - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./audit_log:/app/audit_log
      - ./packets:/app/packets
    command: uvicorn orchestrator.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  agent-intake:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arb-agent-intake
    env_file:
      - .env
    depends_on:
      orchestrator:
        condition: service_healthy

  # NOTE: agent-dating-risk and agent-guideline are not wired for distributed
  # Band mode yet. Agents currently run in-process via handle_case_local().
  # Uncomment and add CMD overrides when implementing distributed agent deployment.

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: arb-ui
    # SECURITY: Do NOT expose port 5173 to host. The built SPA is served
    # by Clinify Express at /materna-ui/ with JWT + doctor auth.
    # Uncomment the line below for local dev only:
    # ports:
    #   - "127.0.0.1:5173:5173"
    depends_on:
      - orchestrator
    environment:
      # In production, the built UI is served by Clinify Express at /materna-ui/
      # and ALL API calls go through /api/materna/* (JWT + doctor auth enforced).
      # This URL is for local dev / standalone demo only.
      - VITE_API_URL=http://orchestrator:8000
